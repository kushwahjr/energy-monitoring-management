# Builds the Windows installer (.exe) and the Mac disk images (.dmg).
# Runs when a version tag like v1.5.0 is pushed, or by hand from the Actions tab ("Run workflow").
# Either way the files are attached to the GitHub Release for the version in energylogger/__init__.py
# (created if needed), and also kept under the run's Artifacts.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to the GitHub Release (false: build and check only)"
        default: "true"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
      - name: Test
        continue-on-error: true   # a flaky test on the build machine should not block the installer
        run: |
          pip install pytest
          python -m pytest -q tests
      - name: Build app
        run: pyinstaller --noconfirm packaging/energymonitoring.spec
      - name: Check the app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergyMonitoring\EnergyMonitoring.exe -ArgumentList "--server" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 1; try { Invoke-WebRequest http://127.0.0.1:8080/api/info -UseBasicParsing | Out-Null; $ok = $true; break } catch {} }
          dist\EnergyMonitoring\EnergyMonitoring.exe --stop
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\Energy Monitoring\logger.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Make installer
        shell: pwsh
        run: |
          $v = (python -c "from energylogger import __version__; print(__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/EnergyMonitoring-Setup-*.exe
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from energylogger import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish != 'false' }}
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Energy Monitoring ${{ steps.ver.outputs.v }}
          files: dist/EnergyMonitoring-Setup-*.exe
      - name: Check the app window opens (after the release, so it ends the log)
        continue-on-error: true   # if it cannot, the app opens the dashboard in the browser instead
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\window-test.txt"
          $p = Start-Process -FilePath dist\EnergyMonitoring\EnergyMonitoring.exe -ArgumentList "--window-test", $out -PassThru
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $r = Get-Content $out -Raw -ErrorAction SilentlyContinue
          Write-Output "Window test: $r"
          Write-Output "::notice title=Window test (Windows)::$($r -replace "`r?`n", '%0A')"
          if ($r -ne "ok") { exit 1 }

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]   # Apple Silicon (M1-M4) and Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
      - name: Build app
        run: pyinstaller --noconfirm packaging/energymonitoring.spec
      - name: Check the app starts
        run: |
          "dist/Energy Monitoring.app/Contents/MacOS/EnergyMonitoring" --server &
          for i in $(seq 40); do sleep 1; curl -sf http://127.0.0.1:8080/api/info >/dev/null && ok=1 && break; done
          "dist/Energy Monitoring.app/Contents/MacOS/EnergyMonitoring" --stop || true
          [ "${ok:-}" = 1 ] || { cat ~/Library/Application\ Support/Energy\ Monitoring/logger.log; exit 1; }
      - name: Check the app window opens
        continue-on-error: true   # if it cannot, the app opens the dashboard in the browser instead
        run: |
          out="$RUNNER_TEMP/window-test.txt"
          "dist/Energy Monitoring.app/Contents/MacOS/EnergyMonitoring" --window-test "$out" &
          pid=$!
          for i in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          echo "Window test: $(cat "$out" 2>/dev/null)"
          [ "$(cat "$out" 2>/dev/null)" = ok ]
      - name: Make disk image
        run: packaging/mac/make-dmg.sh "$(python -c 'from energylogger import __version__; print(__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.os }}
          path: dist/*.dmg
      - name: Version
        id: ver
        run: echo "v=$(python -c 'from energylogger import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish != 'false' }}
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Energy Monitoring ${{ steps.ver.outputs.v }}
          files: dist/*.dmg
