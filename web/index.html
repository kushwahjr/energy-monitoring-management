<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Steel Energy Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><div><b id="plantName">Steel Energy Logger</b><small id="modeLine"></small></div></div>
  <nav id="nav">
    <a href="#/" data-route="overview">Overview</a>
    <a href="#/reports" data-route="reports">Reports</a>
    <a href="#/events" data-route="events">Alarms</a>
    <a href="#/settings" data-route="settings" id="navSettings" hidden>Settings</a>
  </nav>
  <div class="who"><span id="syncBadge" class="badge" hidden></span><button id="logoutBtn" class="ghost" hidden>Sign out</button></div>
</header>
<main id="view"><p class="muted pad">Loading…</p></main>
<div id="toast" role="status" hidden></div>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
